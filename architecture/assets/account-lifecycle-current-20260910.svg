<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
<title id="title">회원 탈퇴·복구 및 국내 LOCAL 보호 구조</title><desc id="desc">사용자 요청은 API를 거쳐 보호 기록 확인 후 MySQL과 Redis의 회원정보를 처리한다. 정기 파기는 공공데이터 수집 후 실행하고 백업 복원도 같은 보호 기준을 사용한다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#56816b"/></marker></defs>
<rect width="1120" height="580" rx="20" fill="#f5faf7"/>
<g font-family="Malgun Gothic, sans-serif" fill="#173e2c"><text x="35" y="49" font-size="27" font-weight="700">회원정보 처리 · 현재 운영 구조</text><text x="35" y="80" font-size="15">2026-09-10 18:10 KST 기준 · 탈퇴/복구/정기 파기 ON · 대장 자동 종료 OFF</text></g>
<g fill="white" stroke="#aac8b7" stroke-width="2"><rect x="35" y="115" width="210" height="116" rx="14"/><rect x="300" y="115" width="215" height="116" rx="14"/><rect x="570" y="115" width="230" height="116" rx="14"/><rect x="855" y="115" width="230" height="116" rx="14"/><rect x="35" y="285" width="210" height="116" rx="14"/><rect x="300" y="285" width="215" height="116" rx="14"/><rect x="570" y="285" width="230" height="116" rx="14"/><rect x="855" y="285" width="230" height="116" rx="14"/></g>
<g stroke="#56816b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M245 173H295"/><path d="M515 173H565"/><path d="M800 173H850"/><path d="M245 343H295"/><path d="M515 343H565"/><path d="M855 343H805"/><path d="M685 285V237"/></g>
<g font-family="Malgun Gothic, sans-serif" text-anchor="middle" fill="#173e2c"><g font-size="20" font-weight="700"><text x="140" y="151">사용자</text><text x="407" y="151">API</text><text x="685" y="151">보호 기록 확인</text><text x="970" y="151">회원정보 처리</text><text x="140" y="323">공공데이터 수집</text><text x="407" y="323">후속 파기 배치</text><text x="685" y="323">공통 보호 기준</text><text x="970" y="323">백업 복원 검증</text></g><g font-size="14"><text x="140" y="181">탈퇴 · 별도 선택 동의</text><text x="140" y="207">동일 소셜 인증 후 복구</text><text x="407" y="181">회차 · 기한 · 세션 검사</text><text x="407" y="207">미완료 ≠ 파기 완료</text><text x="685" y="181">국내 암호화 LOCAL</text><text x="685" y="207">독립 GitHub 집계 기준</text><text x="970" y="181">MySQL 개인정보 · Redis</text><text x="970" y="207">비식별 업무 이력은 보존</text><text x="140" y="355">매일 02:00 KST 시작</text><text x="140" y="380">성공/실패 종료 후 연결</text><text x="407" y="355">기한 도래 · 재시도 대상</text><text x="407" y="380">회원별 처리 · 실패 알림</text><text x="685" y="355">잠금 · 회차 · 독립 기준</text><text x="685" y="380">API / 배치 / 복원 공유</text><text x="970" y="355">격리 복원 → 보호 재적용</text><text x="970" y="380">검증 전 재개 승인 금지</text></g></g>
<g font-family="Malgun Gothic, sans-serif" fill="#496355" font-size="15"><text x="35" y="454">R2 웹 캐시는 별도 영역입니다. 현재 회원별 파기 기록 저장소가 아닙니다.</text><text x="35" y="486">LOCAL 파일은 같은 미니 PC에 있으므로 장비 전체 유실에 대비한 독립 백업은 아닙니다.</text><text x="35" y="518">남은 인수: 실계정 탈퇴·복구 / 활성화 후 첫 정기 실행 / 사본 종료·개별 대장 종료 검증</text><text x="35" y="549">전체 제보·감사 이력의 기간별 삭제는 취소했습니다. 개인정보 포함 원본의 영구 보존을 뜻하지 않습니다.</text></g>
</svg>
