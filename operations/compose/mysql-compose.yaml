services:
  mysql:
    image: mysql:8.0
    container_name: toilet-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - toilet-admin_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - toilet-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  toilet-admin_mysql_data:
    external: true

networks:
  toilet-network:
    name: toilet-network
